    function getSession() {

    }
    function handleExpiredSession() {
      localStorage.removeItem("movieAppSession");

    function ensureActiveSession(initialCheck = false) {
      const session = getSession();
      if (!session) {
        sessionStatusText.textContent = "Not logged in";
        window.location.href = "index.html";
        return false;
      }
      const now = Date.now();
      if (now > session.expiresAt) {
        sessionStatusText.textContent = "Expired";
        handleExpiredSession();
        return false;
      }
      const remainingMs = session.expiresAt - now;
      const remainingMinutes = Math.max(1, Math.floor(remainingMs / 60000));
      sessionStatusText.textContent = `Active (~${remainingMinutes} min left)`;
      return true;
    }
    function startSessionWatcher() {
      setInterval(() => { ensureActiveSession(false); }, 30000);

    // ---------- Utils ----------

      if (!ts) return "";
      try {
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleString();
      } catch { return ""; }
    }
    function formatTime(seconds) {
      if (!isFinite(seconds)) return "0:00";
      const s = Math.floor(seconds % 60);
      const m = Math.floor((seconds / 60) % 60);
      const h = Math.floor(seconds / 3600);
      const two = (n) => (n < 10 ? "0" + n : "" + n);
      if (h > 0) return `${h}:${two(m)}:${two(s)}`;
      return `${m}:${two(s)}`;
    }
    function shuffleArray(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    // ---------- Wistia helpers ----------
    function extractWistiaHash(input) {
      if (!input) return null;
      input = String(input).trim();
      let m = input.match(/wistia_async_([A-Za-z0-9_-]{6,})/);
      if (m && m[1]) return m[1];
      m = input.match(/medias\/([A-Za-z0-9_-]{6,})/);
      if (m && m[1]) return m[1];
      m = input.match(/([A-Za-z0-9_-]{6,12})/);
      if (m && m[1]) return m[1];
      return null;
    }
    function isProbablyWistia(input) {
      if (!input) return false;
      return /wistia|medias/i.test(input) || !!extractWistiaHash(input);
    }
    function ensureWistiaScript() {
      return new Promise((resolve) => {
        if (wistiaScriptLoaded || window._wq) { wistiaScriptLoaded = true; return resolve(); }
        const s = document.createElement('script');
        s.src = "https://fast.wistia.com/assets/external/E-v1.js";
        s.async = true;
        s.onload = () => { wistiaScriptLoaded = true; resolve(); };
        s.onerror = () => { wistiaScriptLoaded = true; resolve(); };
        document.head.appendChild(s);
        setTimeout(() => { wistiaScriptLoaded = true; resolve(); }, 1000);
      });
    }

    // ---------- helpers to toggle UI visibility ----------
    function updateTrendingVisibility() {
      // show trending only when not playing and not searching
      if (!isVideoPlaying && !searchActive) {
        trendingSection.style.display = '';
      } else {
        trendingSection.style.display = 'none';
      }

    function setMoreLikeVisibility(show) {

        playerVideo.removeAttribute('src');

    function removeWistiaEmbed() {

        wistiaPlayerBox.innerHTML = '';

    }
    async function openPlayer(movie) {
      ensureActiveSession();
      currentMovie = movie;
      const url = (movie.videoUrl || "").trim();
      const useWistia = isProbablyWistia(url) && !url.toLowerCase().endsWith('.mp4');

      removeWistiaEmbed();
      stopHtmlVideo();
      playerVideo.style.display = 'none';
      playerControls.style.display = 'none';

      playerTitle.textContent = movie.title || "";
      playerDescription.textContent = movie.description || "";
      playerCategory.textContent = movie.category ? "Category: " + movie.category : "";
      playerMeta.textContent = movie.createdAt ? "Added: " + formatDate(movie.createdAt) : "";

      // hide suggestions initially when opening player (we'll show if paused/ended)
      setMoreLikeVisibility(false);

      // Hide trending (video playing view should not show trending)
      isVideoPlaying = true;
      updateTrendingVisibility();

      buildMoreLike(movie); // populate more-like data (but kept hidden while playing)
      playerSection.style.display = "block";

      if (useWistia) {
        const hash = extractWistiaHash(url);
        if (!hash) { alert("Wistia link invalid."); return; }
        wistiaPlayerBox.style.display = 'block';
        wistiaPlayerBox.innerHTML = `
          <div class="wistia_responsive_wrapper" style="width:100%;height:100%;position:relative;">
            <div class="wistia_embed wistia_async_${hash}" style="height:100%;width:100%;position:absolute;left:0;top:0;"></div>
          </div>
        `;
        await ensureWistiaScript();
        try {
          if (window._wq) {
            window._wq.push({ id: hash, onReady: function(player) {
              try { player.play(); } catch (e) {}
              // Wistia custom events: show suggestions on pause/ended if desired
              try {
                player.bind('play', () => { isVideoPlaying = true; updateTrendingVisibility(); setMoreLikeVisibility(false); });
                player.bind('pause', () => { isVideoPlaying = false; updateTrendingVisibility(); setMoreLikeVisibility(true); });
                player.bind('end', () => { isVideoPlaying = false; updateTrendingVisibility(); setMoreLikeVisibility(true); });
              } catch(e){}
            }});
          }
        } catch (e) { console.warn(e); }
        playerControls.style.display = 'none';
      } else {
        playerVideo.style.display = 'block';
        playerControls.style.display = 'flex';
        playerVideo.src = url;
        playerVideo.currentTime = 0;
        // Attempt to autoplay; update playing state after 'play' event
        playerVideo.play().catch(()=>{});
      }
    }

    // Controls for HTML5
    function updatePlayPauseLabel(){ if (playerVideo.paused) playPauseBtn.textContent = "▶ Play"; else playPauseBtn.textContent = "❚❚ Pause"; }
    playPauseBtn.addEventListener("click", () => { try{ if (playerVideo.paused) playerVideo.play(); else playerVideo.pause(); }catch(e){}});

      updateTrendingVisibility();
      setMoreLikeVisibility(true); // show suggestions on pause
    });
    playerVideo.addEventListener("ended", () => {
      isVideoPlaying = false;
      updateTrendingVisibility();
      setMoreLikeVisibility(true); // show suggestions after ended
    });
    playerVideo.addEventListener("loadedmetadata", ()=>{ const dur = playerVideo.duration || 0; timeTotal.textContent = formatTime(dur); });
    playerVideo.addEventListener("timeupdate", ()=> {
      if (isUserScrubbing) return;
      const cur = playerVideo.currentTime || 0;
      const dur = playerVideo.duration || 0;
      timeCurrent.textContent = formatTime(cur);
      progressBar.value = dur ? ((cur / dur) * 100).toFixed(1) : 0;
    });
    progressBar.addEventListener("input", (e)=> {
      isUserScrubbing = true;
      const val = parseFloat(e.target.value || "0");
      const dur = playerVideo.duration || 0;
      if (dur > 0) { playerVideo.currentTime = (val / 100) * dur; timeCurrent.textContent = formatTime(playerVideo.currentTime); }
    });
    progressBar.addEventListener("change", ()=>{ isUserScrubbing = false; });

    // ---------- More-like ----------
    function buildMoreLike(movie) {
      const others = shuffleArray(allMovies.filter((m) => m.id !== movie.id));
      moreLikeRow.innerHTML = "";
      if (others.length === 0) { moreLikeSection.style.display = "none"; return; }
      others.slice(0, 8).forEach((m) => {
        const card = document.createElement("div");
        card.className = "more-like-card";
        card.style.borderRadius = "6px";
        card.innerHTML = `<img src="${m.thumbnailUrl || ''}" alt="${(m.title||'')}">`;
        card.addEventListener("click", () => { openPlayer(m); window.scrollTo({ top: 0, behavior: "smooth" }); });
        moreLikeRow.appendChild(card);
      });
      // note: we populate but we do NOT show here — visibility controlled by setMoreLikeVisibility()
    }

    // ---------- Load Trending ----------
    async function loadTrending(limit = 8) {
      try {
        trendingRow.innerHTML = '<div style="color:#9ca3af;padding:8px 12px;">Loading…</div>';
        const q = query(collection(db, "movies"), orderBy("rank"));
        const snap = await getDocs(q);
        const items = [];
        snap.forEach(docSnap => {
          const d = docSnap.data();
          if (d) items.push({ id: docSnap.id, ...d });
        });
        items.sort((a,b)=> (a.rank||9999) - (b.rank||9999));
        const top = items.slice(0, limit);
        trendingRow.innerHTML = '';
        if (top.length === 0) {
          trendingRow.innerHTML = '<div style="color:#9ca3af;padding:8px 12px;">No trending items set.</div>';
          return;
        }
        top.forEach((m, idx) => {
          const num = m.rank || (idx+1);
          const card = document.createElement('div');
          card.className = 'trend-card';
          card.innerHTML = `
            <img src="${m.thumbnailUrl || ''}" alt="${(m.title||'').replace(/"/g,'')}" loading="lazy" />
            <div class="trend-overlay"></div>
            <div class="trend-num" data-num="${num}">${num}</div>
          `;
          if (m.tag) {
            const badge = document.createElement('div');
            badge.className = 'trend-badge';
            badge.textContent = m.tag;
            card.appendChild(badge);
          }
          card.addEventListener('click', () => { try { openPlayer(m); window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ console.log(e); } });
          trendingRow.appendChild(card);
        });
        trendingRow.style.scrollSnapType = 'x mandatory';
        Array.from(trendingRow.children).forEach(ch => ch.style.scrollSnapAlign = 'center');
        updateTrendingVisibility(); // initial visibility check
      } catch (e) {
        console.error('Trending load error', e);
        trendingRow.innerHTML = '<div style="color:#9ca3af;padding:8px 12px;">Failed to load trending.</div>';
      }
    }

    // ---------- Load movies & render category rows ----------
    async function loadMoviesAndCategories() {
      try {
        const qMovies = query(collection(db, "movies"), orderBy("createdAt", "desc"));
        const snap = await getDocs(qMovies);
        allMovies = [];
        snap.forEach(docSnap => {
          const d = docSnap.data();
          allMovies.push({
            id: docSnap.id,
            title: d.title || "",
            description: d.description || "",
            thumbnailUrl: d.thumbnailUrl || "",
            videoUrl: d.videoUrl || "",
            category: d.category || "Other",
            createdAt: d.createdAt || null,
            rank: d.rank || null,
            tag: d.tag || null
          });
        });

        const map = new Map();
        allMovies.forEach(m => {
          const c = (m.category || "Other").trim();
          if (!map.has(c)) map.set(c, []);
          map.get(c).push(m);
        });

        const categories = Array.from(map.entries()).sort((a,b) => b[1].length - a[1].length);

        categoriesContainer.innerHTML = '';
        categories.forEach(([catName, movies]) => {
          const sec = document.createElement('section');
          sec.className = 'cat-section';
          sec.innerHTML = `
            <div class="cat-title-row">
              <div class="cat-title">${catName}</div>
              <div style="font-size:13px;color:#9ca3af">${movies.length} titles</div>
            </div>
            <div class="cat-row" role="list"></div>
          `;
          const row = sec.querySelector('.cat-row');
          movies.forEach((m, index) => {
            const card = document.createElement('div');
            card.className = 'cat-card';
            card.innerHTML = `<img src="${m.thumbnailUrl || ''}" alt="${m.title || ''}" loading="lazy" />`;
            if (m.tag) {
              const badge = document.createElement('div');
              badge.className = 'cat-badge';
              badge.textContent = m.tag;
              card.appendChild(badge);
            }
            const num = document.createElement('div');
            num.className = 'cat-num';
            num.textContent = index + 1;
            card.appendChild(num);

            card.addEventListener('click', () => { openPlayer(m); window.scrollTo({ top: 0, behavior: 'smooth' }); });
            row.appendChild(card);
          });
          categoriesContainer.appendChild(sec);
        });

        if (allMovies.length === 0) {
          categoriesContainer.innerHTML = `<div style="color:#9ca3af;padding:20px 8px;">No movies available yet.</div>`;
        }
      } catch (e) {
        console.error('Load movies error', e);
        categoriesContainer.innerHTML = `<div style="color:#9ca3af;padding:20px 8px;">Failed to load movies.</div>`;
      }
    }

    // ---------- Search handlers ----------
    searchBtn.addEventListener("click", () => {
      const q = (searchBox.value || "").trim().toLowerCase();
      if (!q) { searchActive = false; loadMoviesAndCategories(); updateTrendingVisibility(); return; }
      searchActive = true;
      updateTrendingVisibility(); // hide trending while search active
      const filtered = allMovies.filter(m => (m.title||'').toLowerCase().includes(q) || (m.category||'').toLowerCase().includes(q));
      categoriesContainer.innerHTML = '';
      const sec = document.createElement('section');
      sec.className = 'cat-section';
      sec.innerHTML = `<div class="cat-title-row"><div class="cat-title">Search results</div><div style="font-size:13px;color:#9ca3af">${filtered.length} found</div></div><div class="cat-row"></div>`;
      const row = sec.querySelector('.cat-row');
      filtered.forEach((m,i) => {
        const card = document.createElement('div');
        card.className = 'cat-card';
        card.innerHTML = `<img src="${m.thumbnailUrl || ''}" alt="${m.title || ''}" loading="lazy" />`;
        if (m.tag) { const b = document.createElement('div'); b.className='cat-badge'; b.textContent = m.tag; card.appendChild(b); }
        const num = document.createElement('div'); num.className='cat-num'; num.textContent = i+1; card.appendChild(num);
        card.addEventListener('click', ()=>{ openPlayer(m); window.scrollTo({ top:0, behavior:'smooth' }); });
        row.appendChild(card);
      });
      categoriesContainer.appendChild(sec);
    });
    clearSearchBtn.addEventListener("click", () => { searchBox.value=''; searchActive = false; loadMoviesAndCategories(); updateTrendingVisibility(); });

    // ---------- INIT ----------
    (async () => {
      if (!ensureActiveSession(true)) return;
      startSessionWatcher();
      await loadTrending();
      await loadMoviesAndCategories();
      // initial state: suggestions hidden, trending visible (unless session/state)
      setMoreLikeVisibility(false);
      updateTrendingVisibility();
    })();

    // minimal anti-inspect (best-effort)
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) e.preventDefault();
      if (e.key === "F12") e.preventDefault();
    });
    try { navigator.mediaDevices.getDisplayMedia = () => { alert("Screen recording blocked!"); throw new Error("Blocked"); }; } catch(e){}
  </script>
</body>
</html>
