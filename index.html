
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MintuFlix – Enter Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-shadow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(229,9,20,0.35), transparent 55%);
      opacity: 0.45;
      pointer-events: none;
      z-index: -1;
    }

    .top-bar {
      padding: 14px 6vw 0;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e50914;
    }
    .logo span {
      color: #fff;
      font-weight: 500;
      font-size: 18px;
    }

    .center-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 10px;
      padding: 24px 22px 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      color: #e5e7eb;
      display: block;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #020617;
      color: #f9fafb;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    input:focus {
      outline: none;
      border-color: #e50914;
      box-shadow: 0 0 0 1px rgba(229, 9, 20, 0.6);
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px 0;
      border-radius: 999px;
      border: none;
      background: #e50914;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    button:active {
      transform: translateY(1px);
    }

    .msg {
      margin-top: 8px;
      min-height: 18px;
      font-size: 12px;
    }
    .msg.error {
      color: #fecaca;
    }
    .msg.success {
      color: #bbf7d0;
    }

    .session-info {
      margin-top: 10px;
      font-size: 11px;
      color: #9ca3af;
    }
    .session-info span {
      color: #22c55e;
      font-weight: 500;
    }

    .footer {
      padding: 0 16px 14px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="hero-shadow"></div>

  <div class="top-bar">
    <div class="logo">VEX<span>ION</span></div>
  </div>

  <div class="center-wrap">
    <div class="card">
      <div class="card-title">Enter Access Code</div>
      <div class="card-subtitle">
        Enter your one-time secret code to unlock streaming.
      </div>

      <label for="codeInput">Access code</label>
      <input id="codeInput" maxlength="16" placeholder="E.g. A7K9X2P3" />

      <button id="submitBtn">Continue</button>

      <div id="msg" class="msg"></div>
      <div id="sessionInfo" class="session-info" style="display:none;"></div>
    </div>
  </div>

  <div class="footer">
    Secure access · Single-use codes · Time-limited sessions
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJgg7RhvBCMawO_nfi8DVl3SA9j7FGUsE",
      authDomain: "movie-406d8.firebaseapp.com",
      databaseURL: "https://movie-406d8-default-rtdb.firebaseio.com",
      projectId: "movie-406d8",
      storageBucket: "movie-406d8.firebasestorage.app",
      messagingSenderId: "316728310014",
      appId: "1:316728310014:web:98c07213a6a28811c3cdaf",
      measurementId: "G-HV143L1C2X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const codeInput = document.getElementById("codeInput");
    const msgEl = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");
    const sessionInfo = document.getElementById("sessionInfo");

    function setMsg(text, type = "") {
      msgEl.textContent = text;
      msgEl.className = "msg " + (type || "");
    }

    // ---------- SESSION HELPERS ----------
    function getSession() {
      const raw = localStorage.getItem("movieAppSession");
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function checkExistingSessionOnLoad() {
      const session = getSession();
      if (!session) return;

      const now = Date.now();
      if (now < session.expiresAt) {
        const remainingMs = session.expiresAt - now;
        const remainingMinutes = Math.max(1, Math.floor(remainingMs / 60000));
        sessionInfo.style.display = "block";
        sessionInfo.innerHTML =
          `Active session detected &mdash; <span>~${remainingMinutes} min left</span>. Redirecting to movies...`;
        // short delay so user sees message then go
        setTimeout(() => {
          window.location.href = "app.html";
        }, 900);
      } else {
        // expired -> clean up
        localStorage.removeItem("movieAppSession");
      }
    }

    checkExistingSessionOnLoad();

    // ---------- VERIFY CODE ----------
    btn.addEventListener("click", async () => {
      let raw = codeInput.value.trim();
      if (!raw) {
        setMsg("Please enter your access code.", "error");
        return;
      }

      const code = raw.toUpperCase();
      setMsg("Checking code...", "");
      btn.disabled = true;

      try {
        const qRef = query(collection(db, "accessCodes"), where("code", "==", code));
        const snap = await getDocs(qRef);

        if (snap.empty) {
          setMsg("Invalid code. Please check and try again.", "error");
          btn.disabled = false;
          return;
        }

        const docSnap = snap.docs[0];
        const data = docSnap.data();
        const now = Date.now();
        const expiresAtMs = data.expiresAt.toMillis();

        if (data.used) {
          setMsg("This code has already been used on another device.", "error");
          btn.disabled = false;
          return;
        }

        if (expiresAtMs < now) {
          setMsg("This code has expired. Ask admin for a new one.", "error");
          btn.disabled = false;
          return;
        }

        // Mark as used (1 code = 1 device/session)
        await updateDoc(docSnap.ref, {
          used: true,
          usedAt: serverTimestamp()
        });

        // Save session
        const session = {
          codeId: docSnap.id,
          expiresAt: expiresAtMs
        };
        localStorage.setItem("movieAppSession", JSON.stringify(session));

        setMsg("Access granted! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "app.html";
        }, 500);
      } catch (err) {
        console.error(err);
        setMsg("Error: " + err.message, "error");
        btn.disabled = false;
      }
    });

    // Allow Enter key
    codeInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") {
        btn.click();
      }
    });
  </script>
</body>
</html>
